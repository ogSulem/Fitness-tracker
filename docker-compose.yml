version: "3.9"

services:
  app:
    build: .
    container_name: fittrack-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/fittrack
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5001}
      # ALLOWED_ORIGINS нужен только при раздельном деплое (фронт на другом домене)
      # ALLOWED_ORIGINS: https://yourdomain.com
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: fittrack-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
